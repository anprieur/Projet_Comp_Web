<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Pays - Pagination</title>
    <link rel="stylesheet" href="../test/test.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script_v2.js" defer></script>
    <script src="../data/countries.js" defer></script>
</head>
<body>

    <h1>Liste des Pays V2</h1>

    <p>Page <span id="current-page">1</span></p>

    <table>
        <thead>
            <tr>
                <th>Nom en Français</th>
                <th>Population</th>
                <th>Surface (km²)</th>
                <th>Densité (hab/km²)</th>
                <th>Continent</th>
                <th>Drapeau</th>
            </tr>
        </thead>
        <tbody id="countries-table">

        </tbody>
    </table>

    <div class="pagination">
        <button id="prev-btn">⬅️ Précédent</button>
        <button id="next-btn">Suivant ➡️</button>
    </div>

    
    

</body>
</html>
