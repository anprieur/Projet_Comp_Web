<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Pays - Détails</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../data/countries.js" defer></script>
    <script src="script_v3.js" defer></script>
</head>
<body>

    <h1>Liste des Pays V3</h1>
    <p>Page <span id="current-page">1</span></p>

    <table>
        <thead>
            <tr>
                <th>Nom en Français</th>
                <th>Population</th>
                <th>Surface (km²)</th>
                <th>Densité (hab/km²)</th>
                <th>Continent</th>
                <th>Drapeau</th>
            </tr>
        </thead>
        <tbody id="countries-table"></tbody>
    </table>

    <div class="pagination">
        <button id="prev-btn">&lt; Précédent</button>
        <button id="next-btn">Suivant &gt;</button>
    </div>

    <!-- Popup pour les détails d'un pays -->
    <div id="country-popup" class="popup">
        <div class="popup-content">
            <span class="close-btn">&times;</span>
            <h2 id="popup-title"></h2>
            <p><strong>Nom natif :</strong> <span id="popup-nativeName"></span></p>
            <p><strong>Capitale :</strong> <span id="popup-capital"></span></p>
            <p><strong>Fuseaux horaires :</strong> <span id="popup-timezones"></span></p>
            <p><strong>Code d'appel :</strong> <span id="popup-callingCodes"></span></p>
            <p><strong>Devise :</strong> <span id="popup-currencies"></span></p>
            <p><strong>Langues officielles :</strong> <span id="popup-languages"></span></p>
            <p><strong>Pays frontaliers :</strong> <span id="popup-borders"></span></p>
        </div>
    </div>


    <!-- Popup pour afficher un drapeau en grand -->
    <div id="flag-popup" class="popup">
        <span class="close-btn">&times;</span>
        <img id="popup-flag-img" src="" alt="Drapeau en grand">
    </div>
    

</body>
</html>
