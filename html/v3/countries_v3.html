<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Pays - Version 3</title>
    <link rel="stylesheet" href="../style.css">
    <script src="script_v3.js" defer></script>
</head>
<body>
    <header>
        <h1>Pays du Monde - Version 3</h1>
    </header>

    <main>
        <section id="countries-list">
            <h2>Liste des Pays</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Population</th>
                        <th>Surface</th>
                        <th>Densité</th>
                        <th>Continent</th>
                        <th>Drapeau</th>
                    </tr>
                </thead>
                <tbody id="countries-table">

                </tbody>
            </table>

            <div id="pagination">
                <button id="prev" disabled>&lt; Préc</button>
                <span id="page-number">Page 1</span>
                <button id="next">Suiv &gt;</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 - Projet Web Countries</p>
    </footer>
</body>
</html>
