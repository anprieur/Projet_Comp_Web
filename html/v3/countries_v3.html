<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Pays - Version 3</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script_v3.js" defer></script>
    <script src="../data/countries.js" defer></script>
</head>
<body>

    <h1>Liste des Pays V3</h1>

    <p>Page <span id="current-page">1</span></p>

        <section id="countries-list">
            <table>
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Population</th>
                        <th>Surface</th>
                        <th>Densité</th>
                        <th>Continent</th>
                        <th>Drapeau</th>
                    </tr>
                </thead>
                <tbody id="countries-table">

                </tbody>
            </table>

            <div id="pagination">
                <button id="prev" disabled>&lt; Préc</button>
                <button id="next">Suiv &gt;</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 - Projet Web Countries</p>
    </footer>
</body>
</html>
