<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tests - World Countries</title>
    <link rel="stylesheet" href="test.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../data/countries.js" defer></script>
    <script src="../data/class_country.js" defer></script>
    <script src="../data/class_currency.js" defer></script>
    <script src="../data/class_language.js" defer></script>
    <script src="../data/class_currency.js" defer></script>
    <script src="../data/class_country.js" defer></script> 
    <script src="../data/test.js" defer></script> 
    <script src="../data/countries.js" defer></script> 
</head>
<body>
    <header>
        <h1>🧪 Tests des Pays</h1>
        <nav>
            <a href="index.html">Accueil</a>
        </nav>
    </header>
    
    <main>
        <section id="test-buttons">
            <h2>Exécuter les Tests</h2>
            <button onclick="outsideTheContinent()">Pays avec voisins hors continent</button>
            <button onclick="moreNeighbors()">Pays avec le plus de voisins</button>
            <button onclick="neighborless()">Pays sans voisins</button>
            <button onclick="moreLanguages()">Pays parlant le plus de langues</button>
            <button onclick="withCommonLanguage()">Pays partageant une langue avec un voisin</button>
            <button onclick="withoutCommonCurrency()">Pays sans monnaie commune avec un voisin</button>
            <button onclick="sortingDecreasingDensity()">Pays triés par densité décroissante</button>
            <button onclick="moreTopLevelDomains()">Pays avec plusieurs TLDs</button>
        </section>

        <section id="test-results">
            <h2>Résultats</h2>
            <pre id="results"></pre>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 - Projet Web Countries</p>
    </footer>
</body>
</html>
